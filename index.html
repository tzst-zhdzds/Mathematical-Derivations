<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mathematical Derivations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f5f0;
      color: #26352c;
      font-family: system-ui, sans-serif;
    }

    header {
      max-width: 1280px;
      margin: auto;
      padding: 40px 24px 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(26px, 4vw, 40px);
    }

    header p {
      margin: 0;
      color: #667269;
      line-height: 1.7;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      color: #667269;
      font-size: 14px;
    }

    .line-sample {
      width: 30px;
      border-top: 2px solid #52715d;
    }

    .viewport {
      width: min(calc(100% - 32px), 1240px);
      margin: 0 auto 32px;
      border: 1px solid #dedfd6;
      border-radius: 18px;
      background: #fbfaf7;
    }

    .graph {
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--columns, 1), minmax(0, 1fr));
      align-items: start;
      gap: clamp(60px, 6vw, 96px) clamp(24px, 4vw, 64px);
      padding: clamp(20px, 3vw, 48px);
      background-image: radial-gradient(#d9ded5 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .connections {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .card {
      position: relative;
      grid-row: var(--row);
      grid-column: var(--column);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      min-width: 0;
      min-height: 100px;
      padding: 18px clamp(16px, 2vw, 26px);
      border: 1px solid #b9c9bd;
      border-radius: 14px;
      background: #fff;
      color: #26352c;
      text-decoration: none;
      overflow-wrap: anywhere;
      box-shadow: 0 4px 14px #26352c08;
      transition: box-shadow 150ms, border-color 150ms;
    }

    .card:hover {
      border-color: #39704e;
      box-shadow: 0 8px 24px #26352c16;
    }

    .card:focus-visible {
      outline: 3px solid #39704e;
      outline-offset: 4px;
    }

    .card-type {
      color: #607164;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card-title {
      font-size: 1.1875rem;
      font-weight: 650;
      line-height: 1.3;
    }

    .prerequisites {
      display: none;
      color: #516358;
      font-size: 0.875rem;
      line-height: 1.5;
    }

    footer {
      max-width: 1280px;
      margin: auto;
      padding: 0 24px 24px;
      color: #667269;
      font-size: 14px;
    }

    /* On narrow screens, show the cards in reading order. */
    .compact .graph {
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
    }

    .compact .card {
      grid-area: auto;
      min-height: 0;
    }

    .compact .prerequisites {
      display: block;
    }

    .compact .connections,
    .compact .legend,
    .compact footer {
      display: none;
    }

    @media (max-width: 600px) {
      header {
        padding: 28px 16px 20px;
      }

      .viewport {
        width: calc(100% - 24px);
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Mathematical Derivations</h1>

    <p>
      Explore mathematical ideas and the reasoning that connects them.
      Select a card to read.
    </p>

    <div class="legend">
      <span class="line-sample" aria-hidden="true"></span>
      <span>Dependency</span>
    </div>
  </header>

  <main class="viewport" aria-label="Mathematical knowledge map">
    <div class="graph" id="graph">
      <svg class="connections" id="connections" aria-hidden="true">
        <defs>
          <marker
            id="arrow"
            viewBox="0 0 10 10"
            refX="9"
            refY="5"
            markerWidth="7"
            markerHeight="7"
            orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#52715d"/>
          </marker>
        </defs>
      </svg>
    </div>
  </main>

  <footer>
    Arrows point from supporting knowledge to the idea that uses it.
  </footer>

  <script>
    // Add new cards here.
    // Cards with the same x share a column.
    // Cards with the same y share a row.

    const cards = [
      {
        id: "functions",
        title: "Functions",
        type: "Definition",
        file: "./cards/functions.html",
        x: 380,
        y: 860
      },
      {
        id: "equivalence-classes",
        title: "Equivalence Classes and Partitions",
        type: "Definition & Proof",
        file: "./cards/equivalence-classes.html",
        x: 680,
        y: 1060
      },
      {
        id: "sets",
        title: "Sets",
        type: "Definition",
        file: "./cards/sets.html",
        x: 80,
        y: 60
      },
      {
        id: "set-equality",
        title: "Set Equality",
        type: "Definition",
        file: "./cards/set-equality.html",
        x: 80,
        y: 260
      },
      {
        id: "set-operations",
        title: "Set Operations",
        type: "Definition",
        file: "./cards/set-operations.html",
        x: 380,
        y: 260
      },
      {
        id: "cartesian-product",
        title: "Ordered Pairs and Cartesian Products",
        type: "Definition",
        file: "./cards/cartesian-product.html",
        x: 680,
        y: 260
      },
      {
        id: "subsets",
        title: "Subsets",
        type: "Definition & Proof",
        file: "./cards/subsets.html",
        x: 80,
        y: 460
      },
      {
        id: "de-morgan",
        title: "De Morgan's Laws",
        type: "Theorem",
        file: "./cards/de-morgan.html",
        x: 380,
        y: 460
      },
      {
        id: "empty-set",
        title: "Empty Set",
        type: "Definition & Proof",
        file: "./cards/empty-set.html",
        x: 80,
        y: 660
      },
      {
        id: "de-morgan-difference",
        title: "De Morgan's Laws for Set Difference",
        type: "Corollary",
        file: "./cards/de-morgan-difference.html",
        x: 380,
        y: 660
      },
      {
        id: "binary-relations",
        title: "Binary Relations",
        type: "Definition",
        file: "./cards/binary-relations.html",
        x: 680,
        y: 660
      },
      {
        id: "power-set",
        title: "Power Set",
        type: "Definition",
        file: "./cards/power-set.html",
        x: 80,
        y: 860
      },
      {
        id: "properties-of-relations",
        title: "Properties of Relations and Equivalence Relations",
        type: "Definition",
        file: "./cards/properties-of-relations.html",
        x: 680,
        y: 860
      }
    ];

    // Add new arrows here.
    // Each arrow goes from a prerequisite to the card that uses it.

    const links = [
      { from: "binary-relations", to: "functions" },
      { from: "properties-of-relations", to: "equivalence-classes" },
      { from: "sets", to: "set-equality" },
      { from: "sets", to: "set-operations" },
      { from: "sets", to: "cartesian-product" },
      { from: "set-equality", to: "subsets" },
      { from: "set-equality", to: "de-morgan" },
      { from: "set-operations", to: "de-morgan" },
      { from: "subsets", to: "empty-set" },
      { from: "de-morgan", to: "de-morgan-difference" },
      { from: "cartesian-product", to: "binary-relations" },
      { from: "subsets", to: "binary-relations" },
      { from: "empty-set", to: "power-set" },
      { from: "binary-relations", to: "properties-of-relations" }
    ];

    // Build the map from the cards and links above.

    const graph = document.getElementById("graph");
    const svg = document.getElementById("connections");

    const columns = [...new Set(cards.map(card => card.x))].sort((a, b) => a - b);
    const rows = [...new Set(cards.map(card => card.y))].sort((a, b) => a - b);
    const readingOrder = [...cards].sort((a, b) => a.y - b.y || a.x - b.x);

    const cardById = new Map(cards.map(card => [card.id, card]));
    const elements = new Map();

    graph.style.setProperty("--columns", Math.max(columns.length, 1));

    for (const card of readingOrder) {
      const element = document.createElement("a");
      element.className = "card";
      element.href = card.file;
      element.style.setProperty("--column", columns.indexOf(card.x) + 1);
      element.style.setProperty("--row", rows.indexOf(card.y) + 1);

      const type = document.createElement("span");
      type.className = "card-type";
      type.textContent = card.type;

      const title = document.createElement("span");
      title.className = "card-title";
      title.textContent = card.title;

      element.append(type, title);

      const prerequisites = links
        .filter(link => link.to === card.id)
        .map(link => cardById.get(link.from)?.title)
        .filter(Boolean);

      if (prerequisites.length > 0) {
        const note = document.createElement("span");
        note.className = "prerequisites";
        note.textContent = "Depends on: " + prerequisites.join(", ");
        element.append(note);
        element.setAttribute("aria-label", card.title + ". " + note.textContent);
      }

      graph.append(element);
      elements.set(card.id, element);
    }

    const edges = [];

    for (const link of links) {
      const from = elements.get(link.from);
      const to = elements.get(link.to);

      if (!from || !to) continue;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", "#52715d");
      path.setAttribute("stroke-width", "2");
      path.setAttribute("marker-end", "url(#arrow)");

      svg.append(path);
      edges.push({ from, to, path });
    }

    function updateLayout() {
      const compact = graph.clientWidth < columns.length * 248 + 32;
      document.body.classList.toggle("compact", compact);

      if (compact) return;

      const area = graph.getBoundingClientRect();
      const bounds = new Map();

      for (const element of elements.values()) {
        bounds.set(element, element.getBoundingClientRect());
      }

      for (const { from, to, path } of edges) {
        const start = bounds.get(from);
        const end = bounds.get(to);

        const x1 = start.left + start.width / 2 - area.left;
        const y1 = start.bottom - area.top + 2;
        const x2 = end.left + end.width / 2 - area.left;
        const y2 = end.top - area.top - 5;
        const middleY = (y1 + y2) / 2;

        path.setAttribute(
          "d",
          `M ${x1} ${y1} C ${x1} ${middleY}, ${x2} ${middleY}, ${x2} ${y2}`
        );
      }
    }

    updateLayout();

    const observer = new ResizeObserver(updateLayout);
    observer.observe(graph);

    for (const element of elements.values()) {
      observer.observe(element);
    }
  </script>
</body>
</html>
