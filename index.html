<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mathematical Derivations</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f5f0; color: #24362d; font: 1rem/1.5 system-ui, sans-serif; }
    main { max-width: 1600px; margin: auto; padding: clamp(12px, 2.4vw, 36px); }
    h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.5rem); line-height: 1.2; }
    .tools { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
    .tools p { margin: 0; color: #4e6358; }
    .buttons { display: flex; gap: 5px; align-items: center; }
    button { font: inherit; color: inherit; min-width: 40px; padding: 5px 10px; background: white; border: 1px solid #b7c6bc; border-radius: 7px; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    output { min-width: 4ch; text-align: center; font-variant-numeric: tabular-nums; }
    #view { height: 74vh; height: clamp(280px, 75dvh, 980px); overflow: auto; scrollbar-gutter: stable; border: 1px solid #c8d0c7; border-radius: 14px; background: #fbfaf7; cursor: grab; }
    #view.dragging { cursor: grabbing; user-select: none; }
    :focus-visible { outline: 3px solid #29734a; outline-offset: 2px; }
    #frame { position: relative; overflow: hidden; margin-inline: auto; }
    #map { position: absolute; top: 0; left: 0; transform-origin: 0 0; background-image: radial-gradient(#d5dcd2 1px, transparent 1px); background-size: 22px 22px; }
    svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .edge { fill: none; stroke: #51745e; stroke-width: 2; }
    .card { position: absolute; width: 242px; min-height: 96px; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 14px 18px; background: white; border: 1px solid #aabfb1; border-radius: 12px; box-shadow: 0 3px 10px #21392b0a; color: inherit; text-decoration: none; overflow-wrap: anywhere; cursor: pointer; }
    .card:hover, .card:focus-visible { border-color: #397450; box-shadow: 0 4px 14px #21392b18; }
    .card small { color: #536b5a; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    .card strong { font-size: 1.13rem; line-height: 1.28; }
  </style>
</head>
<body>
  <main>
    <h1>Mathematical Derivations</h1>
    <div class="tools">
      <p>Drag the map to explore. Follow an arrow from a prerequisite to the card that uses it.</p>
      <div class="buttons" role="group" aria-label="Map controls">
        <button id="minus" aria-label="Zoom out">-</button>
        <output id="level" aria-label="Zoom level">100%</output>
        <button id="plus" aria-label="Zoom in">+</button>
        <button id="fit">Fit map</button>
        <button id="home">Start</button>
      </div>
    </div>
    <section id="view" tabindex="0" aria-label="Knowledge map. Use the arrow keys to scroll or Tab to visit cards.">
      <div id="frame"><div id="map"><svg aria-hidden="true">
        <defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 0 L10 5 L0 10 Z" fill="#51745e"></path>
        </marker></defs>
        <g id="edges"></g>
      </svg></div></div>
    </section>
  </main>
  <script>
    // x sets the horizontal position. Equal y values share a row.
    // Add a card on a later row than its prerequisites.

   const cards = [
  {
    id: "power-set",
    title: "Power Sets",
    type: "Definition & Proof",
    file: "./cards/power-set.html",
    x: 0,
    y: 600
  },
  {
    id: "subsets",
    title: "Subsets",
    type: "Definition & Proof",
    file: "./cards/subsets.html",
    x: 0,
    y: 400
  },
  {
    id: "logic",
    title: "Basic Logic",
    type: "Foundations",
    file: "./cards/logic.html",
    x: 0,
    y: 0
  },
  {
    id: "zfc",
    title: "ZFC Axioms",
    type: "Axioms",
    file: "./cards/zfc.html",
    x: 0,
    y: 200
  }
];

const links = [
  { from: "subsets", to: "power-set" },
  { from: "logic", to: "zfc" },
  { from: "zfc", to: "subsets" }
];
    
    const byId = id => document.getElementById(id);
    const view = byId("view"), frame = byId("frame"), map = byId("map");
    const nodes = new Map();
    const ordered = [...cards].sort((a, b) => a.y - b.y || a.x - b.x);
    const minX = Math.min(...ordered.map(card => card.x));
    const ranks = [...new Set(ordered.map(card => card.y))];
    const rows = ranks.map(() => []);
    for (const card of ordered) {
      const node = document.createElement("a");
      node.href = card.file;
      node.className = "card";
      const type = document.createElement("small"), title = document.createElement("strong");
      type.textContent = card.type;
      title.textContent = card.title;
      node.append(type, title);
      map.append(node);
      const rank = ranks.indexOf(card.y);
      const item = { node, title: card.title, rank, x: card.x - minX + 72, incoming: [], outgoing: [] };
      nodes.set(card.id, item);
      rows[rank].push(item);
    }

    const edges = [];
    for (const link of links) {
      const source = nodes.get(link.from), target = nodes.get(link.to);
      if (!source || !target || source.rank >= target.rank) continue;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("class", "edge");
      path.setAttribute("marker-end", "url(#tip)");
      byId("edges").append(path);
      const edge = { source, target, path };
      edges.push(edge);
      source.outgoing.push(edge);
      target.incoming.push(edge);
    }
    for (const item of nodes.values()) {
      item.outgoing.sort((a, b) => a.target.x - b.target.x);
      item.incoming.sort((a, b) => a.source.x - b.source.x);
      const parents = item.incoming.map(e => e.source.title);
      if (parents.length) item.node.setAttribute("aria-label", item.title + ". Depends on: " + parents.join(", "));
    }

    // Give each arrow its own attachment point on each card.
    function port(item, group, edge) {
      return item.x + item.node.offsetWidth * (group.indexOf(edge) + 1) / (group.length + 1);
    }

    // Find a free vertical passage on a row that an arrow skips.
    function passage(preferred, blocked) {
      const candidates = [preferred, ...blocked.flatMap(([lo, hi]) => [lo, hi])];
      return candidates.filter(x => x >= 18 && blocked.every(([lo, hi]) => x <= lo || x >= hi))
        .sort((a, b) => Math.abs(a - preferred) - Math.abs(b - preferred))[0];
    }

    let width, height, scale = 1;
    function layout() {
      let top = 50, right = 0;
      const bands = rows.map(row => {
        const bottom = top + Math.max(...row.map(item => item.node.offsetHeight));
        const blocked = [];
        let nextX = 40;
        for (const item of row) {
          item.x = Math.max(item.baseX, nextX);
          const w = item.node.offsetWidth;
          item.top = top;
          item.bottom = top + item.node.offsetHeight;
          item.node.style.left = item.x + "px";
          item.node.style.top = top + "px";
          nextX = item.x + w + 36;
          blocked.push([item.x - 20, item.x + w + 20]);
          right = Math.max(right, item.x + w);
        }
        const band = { top, bottom, blocked };
        top = bottom + 90;
        return band;
      });
      for (const edge of edges) {
        const { source, target } = edge;
        const start = port(source, source.outgoing, edge);
        const end = port(target, target.incoming, edge);
        let x = start;
        let d = "M " + x + " " + (source.bottom + 2);
        function bend(toX, toY, midY) {
          d += " C " + x + " " + midY + " " + toX + " " + midY + " " + toX + " " + toY;
          x = toX;
        }
        for (let r = source.rank + 1; r < target.rank; r++) {
          const band = bands[r];
          const fraction = (r - source.rank) / (target.rank - source.rank);
          const freeX = passage(start + fraction * (end - start), band.blocked);
          band.blocked.push([freeX - 14, freeX + 14]);
          right = Math.max(right, freeX);
          bend(freeX, band.top - 6, (bands[r - 1].bottom + band.top) / 2);
          d += " V " + (band.bottom + 2);

        }
        bend(end, target.top - 5, (bands[target.rank - 1].bottom + target.top) / 2);
        edge.path.setAttribute("d", d);
      }
      width = right + 100;
      height = bands[bands.length - 1].bottom + 100;
      map.style.width = width + "px";
      map.style.height = height + "px";
      applyScale(scale);
    }

    function applyScale(value) {
      scale = value;
      frame.style.width = Math.ceil(width * scale) + "px";
      frame.style.height = Math.ceil(height * scale) + "px";
      map.style.transform = "scale(" + scale + ")";
      byId("level").textContent = Math.round(scale * 100) + "%";
      byId("minus").disabled = scale <= 0.15;
      byId("plus").disabled = scale >= 2;
    }
    function zoom(factor) {
      const cx = view.clientWidth / 2, cy = view.clientHeight / 2;
      const x = (view.scrollLeft + cx) / scale, y = (view.scrollTop + cy) / scale;
      applyScale(Math.min(2, Math.max(0.15, scale * factor)));
      view.scrollTo(x * scale - cx, y * scale - cy);
    }
    function start() {
      const root = rows[0][0];
      applyScale(Math.max(0.82, Math.min(1, view.clientWidth / width)));
      view.scrollTo((root.x + root.node.offsetWidth / 2) * scale - view.clientWidth / 2, 0);
    }
    byId("fit").onclick = () => {
      applyScale(Math.min(1, view.clientWidth / width, view.clientHeight / height));
      view.scrollTo(0, 0);
    };
    byId("home").onclick = start;
    byId("minus").onclick = () => zoom(1 / 1.25);
    byId("plus").onclick = () => zoom(1.25);

    // Touch uses native scrolling. Mouse dragging starts on the background.
    let drag;
    view.addEventListener("pointerdown", e => {
      if (e.pointerType === "touch" || e.button !== 0 || e.target.closest("a")) return;
      const box = view.getBoundingClientRect();
      if (e.clientX >= box.left + view.clientLeft + view.clientWidth ||
          e.clientY >= box.top + view.clientTop + view.clientHeight) return;
      drag = { id: e.pointerId, x: e.clientX, y: e.clientY, left: view.scrollLeft, top: view.scrollTop };
      view.setPointerCapture(e.pointerId);
      view.classList.add("dragging");
    });
    view.addEventListener("pointermove", e => {
      if (drag && drag.id === e.pointerId) {
        view.scrollTo(drag.left + drag.x - e.clientX, drag.top + drag.y - e.clientY);
      }
    });
    view.addEventListener("lostpointercapture", () => {
      drag = null;
      view.classList.remove("dragging");
    });

    for (const item of nodes.values()) item.baseX = item.x;
    layout();
    start();
    const observer = new ResizeObserver(layout);
    for (const item of nodes.values()) observer.observe(item.node);
  </script>
</body>
</html>
